notes: >-
  Two ceilings apply per API key: concurrency (in-flight requests) and sustained RPS. 429 responses
  carry a standard Retry-After header and the JSON error envelope with error code "rate_limited";
  429s are never billed. Batch POST submissions consume one concurrency slot only for the duration
  of the POST; batch items are processed under a separate internal worker budget. The MCP server
  README additionally states a 120 requests / 60s per-key ceiling. Official SDKs (Node/Python/Go/CLI)
  respect Retry-After automatically and ship a client-side token-bucket limiter. Short-term limit
  boosts are available by emailing info@chocodata.com.
